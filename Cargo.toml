[package]
name = "dev-tool"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = {version = "0.32.3", features = [
  "default",
  "__screenshot", # __screenshot is so we can dump a screenshot using EFRAME_SCREENSHOT_TO
]}
egui = "0.32.3"
egui_extras = {version = "0.32.3",features = ["default", "image"]}
env_logger = "0.11.8"
log = "0.4.29"
